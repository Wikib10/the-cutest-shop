    id="automatic-missions"
>

    <p>

    </p>

</div>



<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://peohsktyolhtjdzwjrrk.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_HeAIYFUT37HmOQkZSUr8iw_x_ej8pXN";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



// ==========================================
// RAMKI NICKU
// ==========================================

const frameClasses = [
    "frame-none",
    "frame-pink",
    "frame-purple",
    "frame-blue",
    "frame-mint",
    "frame-yellow",
    "frame-white",
    "frame-black",
    "frame-gray",
    "frame-crystal",
    "frame-royal",
    "frame-gold",
    "frame-vip"
];



// ==========================================
// POBIERANIE NICKU
// ==========================================

async function loadUsername() {

    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {
        return;
    }


    const { data, error } =
        await supabaseClient
            .from("profiles")
            .select("username, username_frame")
            .eq("id", user.id)
            .single();


    if (error) {

        console.error(
            "Blad pobierania profilu:",
            error
        );

        return;
    }


    const usernameLink =
        document.getElementById(
            "username-link"
        );


    if (!usernameLink) {
        return;
    }


    usernameLink.textContent =
        "\u{1F464} " + data.username;


    frameClasses.forEach(
        function(frameClass) {

            usernameLink.classList.remove(
                frameClass
            );

        }
    );


    const selectedFrame =
        data.username_frame ||
        "frame-none";


    usernameLink.classList.add(
        selectedFrame
    );

}



// ==========================================
// SPRAWDZENIE LOGOWANIA
// ==========================================

async function checkLogin() {

    const { data, error } =
        await supabaseClient.auth.getSession();


    if (error || !data.session) {

        window.location.href =
            "logowanie.html";

        return false;
    }


    await loadUsername();

    return true;

}



// ==========================================
// GŁÓWNA FUNKCJA ŁADOWANIA MISJI
// ==========================================

async function loadMissions() {

    const {
        data: userData,
        error: userError
    } =
        await supabaseClient.auth.getUser();


    // ======================================
    // BRAK UŻYTKOWNIKA
    // ======================================

    if (
        userError ||
        !userData.user
    ) {

        console.error(
            "Nie znaleziono zalogowanego użytkownika."
        );


        document.getElementById(
            "personal-missions"
        ).innerHTML = `

            <div class="mission">

                <h3>
                    🔐 Zaloguj się
                </h3>

                <p>
                    Aby wykonywać misje,
                    musisz być zalogowany.
                </p>

            </div>

        `;


        document.getElementById(
            "automatic-missions"
        ).innerHTML = `

            <div class="mission">

                <h3>
                    🔐 Zaloguj się
                </h3>

                <p>
                    Aby zobaczyć swoje misje
                    sklepowe, musisz być zalogowany.
                </p>

            </div>

        `;


        return;
    }


    const userId =
        userData.user.id;



    // ======================================
    // UKOŃCZONE MISJE
    // ======================================

    const {
        data: completedMissions,
        error: completedError
    } =
        await supabaseClient
            .from("user_missions")
            .select("mission_id, status")
            .eq("user_id", userId)
            .eq("status", "approved");


    if (completedError) {

        console.error(
            "Blad pobierania ukonczonych misji:",
            completedError
        );

        return;
    }



    // ======================================
    // WSZYSTKIE AKTYWNE MISJE
    // ======================================

    const {
        data: missions,
        error: missionsError
    } =
        await supabaseClient
            .from("missions")
            .select("*")
            .eq("active", true);


    if (missionsError) {

        console.error(
            "Blad pobierania misji:",
            missionsError
        );

        return;
    }



    // ======================================
    // MISJE MANUALNE
    // ======================================

    const manualMissions =
        missions.filter(
            mission =>
                mission.type === "manual"
        );


    const personalContainer =
        document.getElementById(
            "personal-missions"
        );


    personalContainer.innerHTML = "";


    let visibleManualMissions = 0;


    manualMissions.forEach(
        function(mission) {

            const completed =
                completedMissions.some(
                    completedMission =>
                        completedMission.mission_id ===
                        mission.id
                );


            // Ukończonych nie pokazujemy

            if (completed) {
                return;
            }


            visibleManualMissions++;


            const missionElement =
                document.createElement(
                    "div"
                );


            missionElement.className =
                "mission";


            missionElement.innerHTML = `

                <h3>
                    ${mission.name}
                </h3>


                <p>
                    ${mission.description}
                </p>


                <p>
                    🎁 Nagroda:
                    ${mission.reward} 💕
                </p>


                <button
                    class="mission-button"
                    onclick="submitMission(
                        '${mission.id}',
                        this
                    )"
                >
                    ✓ Zrobione
                </button>

            `;


            personalContainer.appendChild(
                missionElement
            );

        }
    );



    // ======================================
    // BRAK MANUALNYCH MISJI
    // ======================================

    if (
        visibleManualMissions === 0
    ) {

        personalContainer.innerHTML = `

            <div class="mission">

                <h3>
                    🎉 Wszystko zrobione!
                </h3>

                <p>
                    Nie masz teraz żadnych
                    nowych misji. 💕
                </p>

            </div>

        `;
    }



    // ======================================
    // MISJE AUTOMATYCZNE
    // ======================================

    const automaticMissions =
        missions.filter(
            mission =>
                mission.type === "automatic"
        );


    const automaticContainer =
        document.getElementById(
            "automatic-missions"
        );


    automaticContainer.innerHTML = "";


    let visibleAutomaticMissions = 0;


    automaticMissions.forEach(
        function(mission) {

            const completed =
                completedMissions.some(
                    completedMission =>
                        completedMission.mission_id ===
                        mission.id
                );


            // Ukończonych nie pokazujemy

            if (completed) {
                return;
            }


            visibleAutomaticMissions++;


            const missionElement =
                document.createElement(
                    "div"
                );


            missionElement.className =
                "mission";


            missionElement.innerHTML = `

                <h3>
                    ${mission.name}
                </h3>


                <p>
                    ${mission.description}
                </p>


                <p>
                    🎁 Nagroda:
                    ${mission.reward} 💕
                </p>


                <p>
                    ⚡ Ta misja wykona się
                    automatycznie po spełnieniu
                    warunku.
                </p>

            `;


            automaticContainer.appendChild(
                missionElement
            );

        }
    );



    // ======================================
    // BRAK AUTOMATYCZNYCH MISJI
    // ======================================

    if (
        visibleAutomaticMissions === 0
    ) {

        automaticContainer.innerHTML = `

            <div class="mission">

                <h3>
                    🏆 Wszystkie misje sklepowe
                    wykonane!
                </h3>


                <p>
                    Gratulacje, Misiu! 💕
                </p>


                <p>
                    Wykonałeś wszystkie dostępne
                    automatyczne misje.
                </p>

            </div>

        `;
    }

}



// ==========================================
// MIŁOSTKI
// ==========================================

async function loadMilostki() {

    const {
        data: userData,
        error: userError
    } =
        await supabaseClient.auth.getUser();


    if (
        userError ||
        !userData.user
    ) {

        console.error(
            "Nie znaleziono zalogowanego użytkownika."
        );

        return;
    }


    const {
        data: profile,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(
                "id, username, milostki"
            )
            .eq(
                "id",
                userData.user.id
            )
            .maybeSingle();


    if (error) {

        console.error(
            "Blad pobierania Milostek:",
            error
        );

        return;
    }


    if (!profile) {

        console.error(
            "Nie znaleziono profilu użytkownika."
        );

        return;
    }


    document.getElementById(
        "milostki"
    ).textContent =
        profile.milostki || 0;

}



// ==========================================
// ZGŁASZANIE MISJI MANUALNEJ
// ==========================================

async function submitMission(
    missionId,
    button
) {

    button.disabled = true;


    button.textContent =
        "⏳ Wysyłanie...";


    const {
        error
    } =
        await supabaseClient.rpc(
            "submit_mission",
            {
                p_mission_id: missionId
            }
        );


    if (error) {

        console.error(
            "Blad zglaszania misji:",
            error
        );


        button.disabled = false;


        button.textContent =
            "✓ Zrobione";


        alert(
            "Nie udało się zgłosić misji."
        );


        return;
    }


    button.textContent =
        "👀 Do sprawdzenia";

}



// ==========================================
// START
// ==========================================

async function startPage() {

    const loggedIn =
        await checkLogin();


    if (!loggedIn) {
        return;
    }


    await loadMissions();

    await loadMilostki();

}


startPage();

</script>


<script src="script.js"></script>
