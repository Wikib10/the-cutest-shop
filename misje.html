<h1>Misje 🎯</h1>

<div class="welcome">
    <h2>
        Twoje milostki:
        <span id="milostki">0</span> 💕
    </h2>
</div>

<div class="welcome">
    <h2>Gotowy na misję, Misiu? 💕</h2>
    <p>
        Wykonuj misje, zdobywaj osiągnięcia i baw się dobrze!
    </p>
</div>

<!-- ========================= -->
<!-- MISJE MANUALNE -->
<!-- ========================= -->

<h2>💌 Nasze misje</h2>

<div class="missions" id="personal-missions">
    <p>Ładowanie misji... 💕</p>
</div>


<!-- ========================= -->
<!-- MISJE AUTOMATYCZNE -->
<!-- ========================= -->

<h2>🛍️ Misje sklepowe</h2>

<div class="missions" id="automatic-missions">
    <p>Ładowanie misji... 💕</p>
</div>


<script>

const SUPABASE_URL =
    "https://peohsktyolhtjdzwjrrk.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_HeAIYFUT37HmOQkZSUr8iw_x_ej8pXN";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


// ==========================================
// GŁÓWNA FUNKCJA ŁADOWANIA MISJI
// ==========================================

async function loadMissions() {

    // Pobieramy zalogowanego użytkownika
    const {
        data: userData,
        error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !userData.user) {

        console.error(
            "Nie znaleziono zalogowanego użytkownika."
        );

        document.getElementById("personal-missions").innerHTML = `
            <div class="mission">
                <h3>🔐 Zaloguj się</h3>
                <p>Aby wykonywać misje, musisz być zalogowany.</p>
            </div>
        `;

        document.getElementById("automatic-missions").innerHTML = `
            <div class="mission">
                <h3>🔐 Zaloguj się</h3>
                <p>Aby zobaczyć swoje misje sklepowe, musisz być zalogowany.</p>
            </div>
        `;

        return;
    }


    const userId = userData.user.id;


    // ==========================================
    // POBIERANIE UKOŃCZONYCH MISJI TEGO USERA
    // ==========================================

    const {
        data: completedMissions,
        error: completedError
    } = await supabaseClient
        .from("user_missions")
        .select("mission_id, status")
        .eq("user_id", userId)
        .eq("status", "approved");


    if (completedError) {

        console.error(
            "Błąd pobierania ukończonych misji:",
            completedError
        );

        return;
    }


    console.log(
        "UKOŃCZONE MISJE TEGO UŻYTKOWNIKA:",
        completedMissions
    );


    // ==========================================
    // POBIERANIE WSZYSTKICH AKTYWNYCH MISJI
    // ==========================================

    const {
        data: missions,
        error: missionsError
    } = await supabaseClient
        .from("missions")
        .select("*")
        .eq("active", true);


    if (missionsError) {

        console.error(
            "Błąd pobierania misji:",
            missionsError
        );

        return;
    }


    // ==========================================
    // MISJE MANUALNE
    // ==========================================

    const manualMissions =
        missions.filter(
            mission => mission.type === "manual"
        );


    const personalContainer =
        document.getElementById("personal-missions");

    personalContainer.innerHTML = "";


    let visibleManualMissions = 0;


    manualMissions.forEach(function(mission) {

        const completed =
            completedMissions.some(
                completedMission =>
                    completedMission.mission_id === mission.id
            );


        // Jeżeli ukończona — nie pokazujemy
        if (completed) {
            return;
        }


        visibleManualMissions++;


        const missionElement =
            document.createElement("div");

        missionElement.className = "mission";


        missionElement.innerHTML = `
            <h3>${mission.name}</h3>

            <p>
                ${mission.description}
            </p>

            <p>
                🎁 Nagroda:
                ${mission.reward} 💕
            </p>

            <button
                class="mission-button"
                onclick="submitMission('${mission.id}', this)"
            >
                ✓ Zrobione
            </button>
        `;


        personalContainer.appendChild(
            missionElement
        );

    });


    // Jeżeli nie ma już manualnych misji
    if (visibleManualMissions === 0) {

        personalContainer.innerHTML = `
            <div class="mission">
                <h3>🎉 Wszystko zrobione!</h3>
                <p>
                    Nie masz teraz żadnych nowych misji.
                    💕
                </p>
            </div>
        `;
    }


    // ==========================================
    // MISJE AUTOMATYCZNE
    // ==========================================

    const automaticMissions =
        missions.filter(
            mission => mission.type === "automatic"
        );


    const automaticContainer =
        document.getElementById("automatic-missions");

    automaticContainer.innerHTML = "";


    let visibleAutomaticMissions = 0;


    automaticMissions.forEach(function(mission) {

        const completed =
            completedMissions.some(
                completedMission =>
                    completedMission.mission_id === mission.id
            );


        // Jeżeli misja została wykonana,
        // całkowicie ją ukrywamy
        if (completed) {
            return;
        }


        visibleAutomaticMissions++;


        const missionElement =
            document.createElement("div");

        missionElement.className = "mission";


        missionElement.innerHTML = `
            <h3>${mission.name}</h3>

            <p>
                ${mission.description}
            </p>

            <p>
                🎁 Nagroda:
                ${mission.reward} 💕
            </p>

            <p>
                ⚡ Ta misja wykona się automatycznie
                po spełnieniu warunku.
            </p>
        `;


        automaticContainer.appendChild(
            missionElement
        );

    });


    // Jeżeli wszystkie automatyczne są ukończone
    if (visibleAutomaticMissions === 0) {

        automaticContainer.innerHTML = `
            <div class="mission">
                <h3>🏆 Wszystkie misje sklepowe wykonane!</h3>

                <p>
                    Gratulacje, Misiu! 💕
                </p>

                <p>
                    Wykonałeś wszystkie dostępne
                    automatyczne misje.
                </p>
            </div>
        `;
    }

}


// ==========================================
// MILOSTKI
// ==========================================

async function loadMilostki() {

    const {
        data: userData,
        error: userError
    } = await supabaseClient.auth.getUser();


    if (userError || !userData.user) {

        console.error(
            "Nie znaleziono zalogowanego użytkownika."
        );

        return;
    }


    const {
        data: profile,
        error
    } = await supabaseClient
        .from("profiles")
        .select("id, username, milostki")
        .eq("id", userData.user.id)
        .maybeSingle();


    if (error) {

        console.error(
            "Błąd pobierania milostek:",
            error
        );

        return;
    }


    if (!profile) {

        console.error(
            "Nie znaleziono profilu użytkownika."
        );

        return;
    }


    document.getElementById("milostki").textContent =
        profile.milostki || 0;

}


// ==========================================
// ZGŁASZANIE MISJI MANUALNEJ
// ==========================================

async function submitMission(
    missionId,
    button
) {

    button.disabled = true;

    button.textContent =
        "⏳ Wysyłanie...";


    const {
        error
    } = await supabaseClient.rpc(
        "submit_mission",
        {
            p_mission_id: missionId
        }
    );


    if (error) {

        console.error(
            "Błąd zgłaszania misji:",
            error
        );


        button.disabled = false;

        button.textContent =
            "✓ Zrobione";


        alert(
            "Nie udało się zgłosić misji."
        );

        return;
    }


    button.textContent =
        "👀 Do sprawdzenia";
}


// ==========================================
// START
// ==========================================

loadMissions();
loadMilostki();

</script>


<script src="script.js"></script>

</body>
</html>
