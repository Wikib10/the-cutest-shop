<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Promocje - The Cutest Shop</title>

<link rel="stylesheet"
      href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<nav>

    <a href="index.html">
        Home
    </a>

    <a href="nowosci.html">
        Nowości
    </a>

    <a href="promocje.html">
        Promocje
    </a>

    <a href="misje.html">
        Misje
    </a>

    <a href="osiagniecia.html">
        Osiągnięcia
    </a>

    <a href="zamowienia.html">
        Zamówienia
    </a>

    <a href="koszyk.html">
        Koszyk 🛒
    </a>

</nav>


<h1>
    Promocje 🏷️
</h1>


<div class="welcome">

    <h2>
        Coś taniej, Misiu? 💕
    </h2>

    <p>
        Tu znajdziesz wszystkie aktualne
        promocje w The Cutest Shop!
    </p>

</div>


<h2>
    Promocyjne produkty 🏷️
</h2>


<div
    class="products"
    id="sale-products"
>

    <p>
        Ładowanie promocji... 💕
    </p>

</div>



<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://peohsktyolhtjdzwjrrk.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_HeAIYFUT37HmOQkZSUr8iw_x_ej8pXN";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



// ==========================================
// ŁADOWANIE PROMOCJI
// ==========================================

async function loadSaleProducts() {

    const container =
        document.getElementById(
            "sale-products"
        );


    const {
        data: products,
        error
    } =
        await supabaseClient
            .from("products")
            .select("*")
            .eq("is_sale", true);



    // ======================================
    // BŁĄD
    // ======================================

    if (error) {

        console.error(
            "Błąd pobierania promocji:",
            error
        );


        container.innerHTML = `

            <div class="welcome">

                <h3>
                    😢 Ups!
                </h3>

                <p>
                    Nie udało się załadować
                    promocji.
                </p>

            </div>

        `;

        return;

    }



    // ======================================
    // BRAK PROMOCJI
    // ======================================

    if (!products || products.length === 0) {

        container.innerHTML = `

            <div class="welcome">

                <h3>
                    💕 Brak aktualnych promocji
                </h3>

                <p>
                    Na razie wszystko w normalnych
                    cenach, ale zaglądaj tutaj! ✨
                </p>

            </div>

        `;

        return;

    }



    // ======================================
    // CZYŚCIMY KONTENER
    // ======================================

    container.innerHTML = "";



    // ======================================
    // PRODUKTY
    // ======================================

    products.forEach(function(product) {


        const element =
            document.createElement("div");


        element.className =
            "product";



        // ==================================
        // CENA
        // ==================================

        let priceHTML = `

            <p class="price">

                ${product.sale_price}💕

            </p>

        `;



        // ==================================
        // KARTA PRODUKTU
        // ==================================

        element.innerHTML = `

            <a
                href="produkt.html?id=${product.id}"
            >

                <div
                    style="
                        position: relative;
                    "
                >

                    <img
                        src="${product.image_url || ""}"
                        alt="${product.name}"
                    >


                    <span
                        style="
                            position: absolute;
                            top: 10px;
                            left: 10px;
                            background: #ffd6e8;
                            padding: 6px 10px;
                            border-radius: 20px;
                            font-weight: bold;
                        "
                    >
                        🔥 Promocja
                    </span>

                </div>


                <h3>
                    ${product.name}
                </h3>

            </a>


            <p class="description">
                ${product.description || ""}
            </p>


            <p class="price">

                <span
                    style="
                        text-decoration: line-through;
                        opacity: 0.6;
                        margin-right: 6px;
                    "
                >
                    ${product.price}💕
                </span>


                <strong>
                    ${product.sale_price}💕
                </strong>

            </p>

        `;


        container.appendChild(
            element
        );

    });

}



// ==========================================
// START
// ==========================================

loadSaleProducts();


</script>


</body>

</html>
