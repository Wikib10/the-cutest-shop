<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Promocje - The Cutest Shop</title>

    <link rel="stylesheet"
          href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<!-- =========================
     MENU
========================= -->

<nav>

    <a href="index.html">
        Home
    </a>

    <a href="nowosci.html">
        Nowości
    </a>

    <a href="promocje.html">
        Promocje
    </a>

    <a href="misje.html">
        Misje
    </a>

    <a href="osiagniecia.html">
        Osiągnięcia
    </a>

    <a href="zamowienia.html">
        Zamówienia
    </a>

    <a href="ulubione.html">
        Ulubione ❤️
    </a>

    <a href="koszyk.html">
        Koszyk 🛒
    </a>

    <a
        href="profil.html"
        id="username-link"
        class="username-link frame-none"
    >
        👤 Ładowanie...
    </a>

</nav>


<!-- =========================
     NAGŁÓWEK
========================= -->

<h1>
    Promocje 🏷️
</h1>


<div class="welcome">

    <h2>
        Coś taniej, Misiu? 💕
    </h2>

    <p>
        Tu znajdziesz wszystkie aktualne
        promocje w The Cutest Shop!
    </p>

</div>


<!-- =========================
     PRODUKTY
========================= -->

<h2>
    Promocyjne produkty 🏷️
</h2>


<div
    class="products"
    id="sale-products"
>

    <p>
        Ładowanie promocji... 💕
    </p>

</div>



<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://peohsktyolhtjdzwjrrk.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_HeAIYFUT37HmOQkZSUr8iw_x_ej8pXN";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



// ==========================================
// RAMKI NICKU
// ==========================================

const frameClasses = [
    "frame-none",
    "frame-pink",
    "frame-purple",
    "frame-blue",
    "frame-mint",
    "frame-yellow",
    "frame-white",
    "frame-black",
    "frame-gray",
    "frame-crystal",
    "frame-royal",
    "frame-gold",
    "frame-vip"
];



// ==========================================
// POBIERANIE NICKU
// ==========================================

async function loadUsername() {

    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {
        return;
    }


    const { data, error } =
        await supabaseClient
            .from("profiles")
            .select("username, username_frame")
            .eq("id", user.id)
            .single();


    if (error) {

        console.error(
            "Blad pobierania profilu:",
            error
        );

        return;
    }


    const usernameLink =
        document.getElementById(
            "username-link"
        );


    if (!usernameLink) {
        return;
    }


    usernameLink.textContent =
        "\u{1F464} " + data.username;


    frameClasses.forEach(
        function(frameClass) {

            usernameLink.classList.remove(
                frameClass
            );

        }
    );


    const selectedFrame =
        data.username_frame ||
        "frame-none";


    usernameLink.classList.add(
        selectedFrame
    );
}



// ==========================================
// LOGOWANIE
// ==========================================

async function checkLogin() {

    const { data, error } =
        await supabaseClient.auth.getSession();


    if (error || !data.session) {

        window.location.href =
            "logowanie.html";

        return false;
    }


    await loadUsername();

    return true;
}



// ==========================================
// ŁADOWANIE PROMOCJI
// ==========================================

async function loadSaleProducts() {

    const container =
        document.getElementById(
            "sale-products"
        );


    const {
        data: products,
        error
    } =
        await supabaseClient
            .from("products")
            .select("*")
            .eq("is_sale", true)
            .order("name");



    // ======================================
    // BŁĄD
    // ======================================

    if (error) {

        console.error(
            "Blad pobierania promocji:",
            error
        );


        container.innerHTML = `

            <div class="welcome">

                <h3>
                    😢 Ups!
                </h3>

                <p>
                    Nie udalo sie zaladowac
                    promocji.
                </p>

            </div>

        `;

        return;
    }



    // ======================================
    // BRAK PROMOCJI
    // ======================================

    if (!products || products.length === 0) {

        container.innerHTML = `

            <div class="welcome">

                <h3>
                    💕 Brak aktualnych promocji
                </h3>

                <p>
                    Na razie wszystko w normalnych
                    cenach, ale zaglądaj tutaj! ✨
                </p>

            </div>

        `;

        return;
    }



    // ======================================
    // CZYŚCIMY KONTENER
    // ======================================

    container.innerHTML = "";



    // ======================================
    // PRODUKTY
    // ======================================

    products.forEach(
        function(product) {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "product";



            // ==================================
            // KARTA PRODUKTU
            // ==================================

            element.innerHTML = `

                <a
                    href="produkt.html?id=${product.id}"
                >

                    <div
                        style="
                            position: relative;
                        "
                    >

                        <img
                            src="${product.image_url || ""}"
                            alt="${product.name}"
                        >


                        <span
                            style="
                                position: absolute;
                                top: 10px;
                                left: 10px;
                                background: #ffd6e8;
                                padding: 6px 10px;
                                border-radius: 20px;
                                font-weight: bold;
                            "
                        >
                            🔥 Promocja
                        </span>

                    </div>


                    <h3>
                        ${product.name}
                    </h3>

                </a>


                <p class="description">
                    ${product.description || ""}
                </p>


                <p class="price">

                    <del>
                        ${product.price} 💕
                    </del>

                    <strong>
                        ${product.sale_price} 💕
                    </strong>

                </p>

            `;


            container.appendChild(
                element
            );

        }
    );

}



// ==========================================
// START
// ==========================================

async function startPage() {

    const loggedIn =
        await checkLogin();


    if (!loggedIn) {
        return;
    }


    await loadSaleProducts();

}


startPage();


</script>


</body>

</html>
