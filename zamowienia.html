<h1>Moje zamówienia 📦💕</h1>

<div id="orders-container">
    <p>Ładowanie zamówień...</p>
</div>

<script>

const SUPABASE_URL = "https://peohsktyolhtjdzwjrrk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_HeAIYFUT37HmOQkZSUr8iw_x_ej8pXN";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

function getStatusText(status) {
    if (status === "pending") {
        return "⏳ Oczekuje na potwierdzenie";
    }

    if (status === "confirmed") {
        return "💕 Potwierdzone";
    }

    if (status === "completed") {
        return "✅ Zrealizowane";
    }

    if (status === "cancelled") {
        return "❌ Anulowane";
    }

    return status;
}

async function loadOrders() {

    const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !user) {
        window.location.href = "logowanie.html";
        return;
    }

    const container = document.getElementById("orders-container");

    const { data, error } = await supabaseClient
        .from("orders")
        .select("*")
        .eq("user_id", user.id)
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Błąd pobierania zamówień:", error);
        container.innerHTML = "<p>Nie udało się pobrać zamówień.</p>";
        return;
    }

    if (data.length === 0) {
        container.innerHTML = "<p>Nie masz jeszcze żadnych zamówień. 🛒💕</p>";
        return;
    }

    container.innerHTML = "";

for (const order of data) {

    const orderElement = document.createElement("div");
    orderElement.classList.add("order");

    const date = new Date(order.created_at);

    const { data: items, error: itemsError } = await supabaseClient
        .from("order_items")
        .select("*")
        .eq("order_id", order.id);

    if (itemsError) {
        console.error("Błąd pobierania produktów zamówienia:", itemsError);
        continue;
    }

    orderElement.innerHTML = `
        <h3>Zamówienie 📦</h3>
        <p>Data: ${date.toLocaleString("pl-PL")}</p>
        <div class="order-products"></div>
        <p>Razem: ${order.total} 💕</p>
        <p>Status: ${getStatusText(order.status)}</p>
    `;

    const productsContainer =
        orderElement.querySelector(".order-products");

    items.forEach(function(item) {

        const productElement = document.createElement("p");

        productElement.textContent =
            "🛒 " +
            item.product_name +
            " × " +
            item.quantity +
            " — " +
            (item.price * item.quantity) +
            " 💕";

        productsContainer.appendChild(productElement);
    });

    container.appendChild(orderElement);
}
}

loadOrders();

</script>

</body>
</html>
