<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zamówienie - The Cutest Shop</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<nav>

<a href="index.html">Home</a>

<a href="nowosci.html">Nowości</a>

<a href="promocje.html">Promocje</a>

<a href="misje.html">Misje</a>

<a href="osiagniecia.html">Osiągnięcia</a>

<a href="zamowienia.html">Zamówienia</a>

<a href="ulubione.html">Ulubione ❤️</a>

<a href="koszyk.html">Koszyk 🛒</a>

<a
    href="profil.html"
    id="username-link"
    class="username-link frame-none"
>
    👤 Ładowanie...
</a>

</nav>


<h1>Podsumowanie zamówienia 📦💕</h1>


<div id="order-summary"></div>


<div id="order-total">

    <p class="delivery-info">
        📦 Czas realizacji zamówienia: 1–3 dni robocze
    </p>

    <strong>
        Razem:
        <span id="summary-total">0</span> 💕
    </strong>

</div>


<div id="order-notes">

    <label for="notes">
        💌 Uwagi do zamówienia
    </label>

    <textarea
        id="notes"
        placeholder="Np. proszę o realizację zamówienia w konkretny dzień..."
        rows="4"
        maxlength="500"
    ></textarea>

</div>


<button id="place-order-button">
    💕 Złóż zamówienie
</button>


<script>

(async function() {


    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://peohsktyolhtjdzwjrrk.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_HeAIYFUT37HmOQkZSUr8iw_x_ej8pXN";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );



    // ==========================================
    // KLASY RAMEK
    // ==========================================

    const frameClasses = [

        "frame-none",
        "frame-pink",
        "frame-purple",
        "frame-blue",
        "frame-mint",
        "frame-yellow",
        "frame-white",
        "frame-black",
        "frame-gray",
        "frame-crystal",
        "frame-royal",
        "frame-gold",
        "frame-vip"

    ];



    // ==========================================
    // SPRAWDZENIE LOGOWANIA
    // ==========================================

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    if (userError || !user) {

        window.location.href =
            "logowanie.html";

        return;
    }



    // ==========================================
    // POBIERANIE NICKU + RAMKI
    // ==========================================

    const {
        data: profile,
        error: profileError
    } = await supabaseClient
        .from("profiles")
        .select("username, username_frame")
        .eq("id", user.id)
        .single();


    if (!profileError && profile) {

        const usernameLink =
            document.getElementById(
                "username-link"
            );


        usernameLink.textContent =
            "\u{1F464} " + profile.username;


        frameClasses.forEach(
            function(frameClass) {

                usernameLink.classList.remove(
                    frameClass
                );

            }
        );


        const selectedFrame =
            profile.username_frame ||
            "frame-none";


        usernameLink.classList.add(
            selectedFrame
        );

    }



    // ==========================================
    // KOSZYK
    // ==========================================

    const cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    const summary =
        document.getElementById(
            "order-summary"
        );


    const totalElement =
        document.getElementById(
            "summary-total"
        );


    const placeOrderButton =
        document.getElementById(
            "place-order-button"
        );


    let total = 0;



    // ==========================================
    // PUSTY KOSZYK
    // ==========================================

    if (cart.length === 0) {

        summary.textContent =
            "Koszyk jest pusty 🛒💕";


        placeOrderButton.disabled =
            true;

    } else {


        // ==========================================
        // PRODUKTY
        // ==========================================

        cart.forEach(function(product) {


            const quantity =
                product.quantity || 1;


            const productPrice =
                Number(product.price) || 0;


            const originalPrice =
                Number(
                    product.original_price
                ) || productPrice;


            const hasSale =
                originalPrice >
                productPrice;


            const productTotal =
                productPrice *
                quantity;


            total += productTotal;


            const item =
                document.createElement(
                    "div"
                );


            item.style.marginBottom =
                "10px";


            if (hasSale) {

                item.innerHTML = `

                    <span>

                        ${product.name}
                        × ${quantity}
                        —

                        <del
                            style="
                                text-decoration: line-through !important;
                            "
                        >
                            ${originalPrice}💕
                        </del>

                        <strong>
                            ${productPrice}💕
                        </strong>

                    </span>

                `;

            } else {

                item.textContent =
                    product.name +
                    " × " +
                    quantity +
                    " — " +
                    productTotal +
                    " 💕";

            }


            summary.appendChild(
                item
            );

        });

    }



    // ==========================================
    // SUMA
    // ==========================================

    totalElement.textContent =
        total;



    // ==========================================
    // ZŁOŻENIE ZAMÓWIENIA
    // ==========================================

    placeOrderButton.addEventListener(
        "click",
        async function() {


            if (cart.length === 0) {
                return;
            }


            placeOrderButton.disabled =
                true;


            placeOrderButton.textContent =
                "⏳ Składanie zamówienia...";


            const items =
                cart.map(function(product) {

                    return {

                        product_id:
                            product.id,

                        quantity:
                            product.quantity || 1

                    };

                });


            console.log(
                "ITEMS DO ZAMÓWIENIA:",
                items
            );


            const notes =
                document
                    .getElementById("notes")
                    .value
                    .trim();



            // ==========================================
            // RPC
            // ==========================================

            const {
                data: orderId,
                error
            } = await supabaseClient.rpc(
                "create_order_with_notes",
                {
                    p_items: items,
                    p_notes: notes
                }
            );


            if (error) {

                console.error(
                    "Błąd tworzenia zamówienia:",
                    error
                );


                placeOrderButton.disabled =
                    false;


                placeOrderButton.textContent =
                    "💕 Złóż zamówienie";


                alert(
                    "Nie udało się złożyć zamówienia. 😭"
                );


                return;
            }



            // ==========================================
            // WYCZYSZCZENIE KOSZYKA
            // ==========================================

            localStorage.removeItem(
                "cart"
            );


            alert(
                "Zamówienie zostało złożone! 💕📦"
            );


            window.location.href =
                "zamowienia.html";

        }
    );


})();

</script>

</body>
</html>
