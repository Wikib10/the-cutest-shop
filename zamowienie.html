<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Zamówienie - The Cutest Shop</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<nav>

<a href="nowosci.html">Nowości</a>
<a href="promocje.html">Promocje</a>
<a href="misje.html">Misje</a>

<a href="koszyk.html">Koszyk🛒</a>
</nav>

<h1>Podsumowanie zamówienia 📦💕</h1>

<div id="order-summary"></div>

<div id="order-total">

    <p class="delivery-info">
        📦 Czas realizacji zamówienia: 1–3 dni robocze
    </p>

    <strong>
        Razem: <span id="summary-total">0</span> 💕
    </strong>

</div>

<div id="order-notes">

    <label for="notes">
        💌 Uwagi do zamówienia
    </label>

    <textarea
        id="notes"
        placeholder="Np. proszę o realizację zamówienia w konkretny dzień..."
        rows="4"
        maxlength="500"
    ></textarea>

</div>

<button id="place-order-button">
    💕 Złóż zamówienie
</button>

<script>
(async function() {

    const SUPABASE_URL =
        "https://peohsktyolhtjdzwjrrk.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_HeAIYFUT37HmOQkZSUr8iw_x_ej8pXN";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {
        window.location.href = "logowanie.html";
        return;
    }

    const cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];

    const summary =
        document.getElementById(
            "order-summary"
        );

    const totalElement =
        document.getElementById(
            "summary-total"
        );

    const placeOrderButton =
        document.getElementById(
            "place-order-button"
        );

    let total = 0;

    if (cart.length === 0) {

        summary.textContent =
            "Koszyk jest pusty 🛒💕";

        placeOrderButton.disabled =
            true;

    } else {

        cart.forEach(function(product) {

            const quantity =
                product.quantity || 1;

            const productPrice =
                Number(product.price) || 0;

            const originalPrice =
                Number(
                    product.original_price
                ) || productPrice;

            const hasSale =
                originalPrice >
                productPrice;

            const productTotal =
                productPrice *
                quantity;

            total += productTotal;

            const item =
                document.createElement(
                    "div"
                );

            item.style.marginBottom =
                "10px";

            if (hasSale) {

                item.innerHTML = `
                    <span>
                        ${product.name}
                        × ${quantity}
                        —
                        <del
                            style="
                                text-decoration: line-through !important;
                            "
                        >
                            ${originalPrice}💕
                        </del>
                        <strong>
                            ${productPrice}💕
                        </strong>
                    </span>
                `;

            } else {

                item.textContent =
                    product.name +
                    " × " +
                    quantity +
                    " — " +
                    productTotal +
                    " 💕";
            }

            summary.appendChild(item);

        });

    }

    totalElement.textContent =
        total;

    placeOrderButton.addEventListener(
        "click",
        async function() {

            if (cart.length === 0) {
                return;
            }

            placeOrderButton.disabled =
                true;

            placeOrderButton.textContent =
                "⏳ Składanie zamówienia...";

            const items =
                cart.map(function(product) {

                    return {
                        product_id:
                            product.id,

                        quantity:
                            product.quantity || 1
                    };

                });

            console.log(
                "ITEMS DO ZAMÓWIENIA:",
                items
            );

            const notes =
                document
                    .getElementById("notes")
                    .value
                    .trim();

            const {
                data: orderId,
                error
            } = await supabaseClient.rpc(
                "create_order_with_notes",
                {
                    p_items: items,
                    p_notes: notes
                }
            );

            if (error) {

                console.error(
                    "Błąd tworzenia zamówienia:",
                    error
                );

                placeOrderButton.disabled =
                    false;

                placeOrderButton.textContent =
                    "💕 Złóż zamówienie";

                alert(
                    "Nie udało się złożyć zamówienia. 😭"
                );

                return;
            }

            localStorage.removeItem(
                "cart"
            );

            alert(
                "Zamówienie zostało złożone! 💕📦"
            );

            window.location.href =
                "zamowienia.html";

        }
    );

})();
</script>

</body>
</html>
