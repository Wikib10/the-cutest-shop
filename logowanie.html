<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie — The Cutest Shop</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #fff0f6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 40px 35px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 8px;
            color: #d85b91;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #f0c6d9;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #d85b91;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #d85b91;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 18px;
            min-height: 22px;
            color: #d85b91;
        }
    </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="login-box">

        <div class="logo">💕🛍️</div>

        <h1>The Cutest Shop</h1>

        <div class="subtitle">
            Zaloguj się, aby wejść do sklepu ✨
        </div>

        <form id="loginForm">

            <label for="username">Nazwa użytkownika</label>
            <input
                type="text"
                id="username"
                placeholder="Wpisz swoją nazwę"
                required
            >

            <label for="password">Hasło</label>
            <input
                type="password"
                id="password"
                placeholder="Wpisz swoje hasło"
                required
            >

            <button type="submit">
                Zaloguj się 💕
            </button>

            <div class="message" id="message"></div>

        </form>

    </div>

<script>
    const SUPABASE_URL = "https://peohsktyolhtjdzwjrrk.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_HeAIYFUT37HmOQkZSUr8iw_x_ej8pXN";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
            message.textContent = "Wpisz nazwę użytkownika i hasło.";
            return;
        }

        message.textContent = "Logowanie...";

        try {
            const response = await fetch(
                SUPABASE_URL + "/functions/v1/login-by-username",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_PUBLISHABLE_KEY
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

            const result = await response.json();
				
			console.log("WYNIK LOGOWANIA:", result);

            if (!response.ok) {
                message.textContent =
                    result.error || "Nie udało się zalogować.";
                return;
            }

            const { error } = await supabaseClient.auth.setSession({
                access_token: result.access_token,
                refresh_token: result.refresh_token
            });

            if (error) {
                message.textContent = "Nie udało się utworzyć sesji.";
                console.error(error);
                return;
            }

            message.textContent = "Zalogowano! ✨";

const { data: authData } = await supabaseClient.auth.getUser();

if (authData.user) {
    const { error: missionError } = await supabaseClient.rpc(
        "complete_first_login_mission"
    );

    if (missionError) {
        console.error(
            "Błąd misji pierwszego logowania:",
            missionError
        );
    }
}

const { error: badgeError } = await supabaseClient.rpc(
    "unlock_my_badge",
    {
        p_badge_name: "Pierwszy krok"
    }
);

if (badgeError) {
    console.error(
        "Błąd odblokowania odznaki:",
        badgeError
    );
}

setTimeout(() => {
    window.location.href = "index.html";
}, 700);

        } catch (error) {
            console.error(error);
            message.textContent =
                "Nie udało się połączyć z serwerem.";
        }
    });
</script>
</script>
</body>
</html>
