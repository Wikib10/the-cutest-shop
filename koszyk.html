<h1>Twój koszyk 🛒</h1>

<div id="cart-items"></div>

<div id="cart-summary">

    <p class="delivery-info">
        📦 Czas realizacji zamówienia: 1–3 dni robocze
    </p>

    <div class="cart-total-row">
        <span>Razem:</span>
        <strong><span id="cart-total">0</span> 💕</strong>
    </div>

    <button id="checkout-button">
        🛍️ Przejdź do zamówienia
    </button>

</div>

<script>

const SUPABASE_URL = "https://peohsktyolhtjdzwjrrk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_HeAIYFUT37HmOQkZSUr8iw_x_ej8pXN";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const frameClasses = [
    "frame-none",
    "frame-pink",
    "frame-purple",
    "frame-blue",
    "frame-mint",
    "frame-yellow",
    "frame-white",
    "frame-black",
    "frame-gray",
    "frame-crystal",
    "frame-royal",
    "frame-gold",
    "frame-vip"
];


// ==========================================
// SPRAWDZENIE LOGOWANIA
// ==========================================

async function checkLogin() {

    const { data, error } =
        await supabaseClient.auth.getSession();

    if (error || !data.session) {

        window.location.href =
            "logowanie.html";

        return;
    }

    await loadUsername();
}


// ==========================================
// NICK W MENU
// ==========================================

async function loadUsername() {

    const { data: { user } } =
        await supabaseClient.auth.getUser();

    if (!user) return;

    const { data, error } =
        await supabaseClient
            .from("profiles")
            .select("username, username_frame")
            .eq("id", user.id)
            .single();

    if (error) {

        console.error(
            "Błąd pobierania profilu:",
            error
        );

        return;
    }

    const usernameLink =
        document.getElementById(
            "username-link"
        );

    if (!usernameLink) return;

    usernameLink.textContent =
        "\u{1F464} " + data.username;

    frameClasses.forEach(function(frameClass) {

        usernameLink.classList.remove(
            frameClass
        );

    });

    const selectedFrame =
        data.username_frame ||
        "frame-none";

    usernameLink.classList.add(
        selectedFrame
    );
}


// ==========================================
// START
// ==========================================

checkLogin();

</script>

<script src="cart.js"></script>

</body>
